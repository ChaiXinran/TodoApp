workflows:
  richang-ios-pwa:
    name: 日常 · iPhone PWA
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      flutter: 3.47.8
    cache:
      cache_paths:
        - $HOME/.pub-cache
    scripts:
      - name: Prepare pinned offline assets
        script: python3 tools/prepare_assets.py
      - name: Resolve Flutter dependencies
        script: flutter pub get
      - name: Analyze and test
        script: |
          set -euo pipefail
          flutter analyze
          flutter test
      - name: Compile SQLite browser worker
        script: dart compile js -O2 tools/sqlite_worker.dart -o web/sqflite_sw.js
      - name: Build Flutter Web and offline cache
        script: |
          set -euo pipefail
          flutter build web --release --no-web-resources-cdn --base-href /
          python3 tools/prepare_pwa.py
      - name: Package website
        script: |
          set -euo pipefail
          cd build/web
          zip -r ../../richang-ios-pwa-web.zip .
    artifacts:
      - richang-ios-pwa-web.zip
